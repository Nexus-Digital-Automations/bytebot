[supervisord]
nodaemon=true
user=browser-user
logfile=/app/logs/supervisord.log
pidfile=/app/logs/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info

[program:browser-use-service]
command=python /app/app.py
directory=/app
user=browser-user
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/browser-use.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset
user=browser-user
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/xvfb.log
priority=100

[unix_http_server]
file=/app/logs/supervisor.sock
chmod=0700
chown=browser-user:browser-user

[supervisorctl]
serverurl=unix:///app/logs/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface