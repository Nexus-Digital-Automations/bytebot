# Default server configuration for Nginx reverse proxy
# This file provides additional server blocks and specific routing rules

# WebSocket upgrade configuration
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=browser_session:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=browser_screenshot:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=browser_task:10m rate=5r/s;

# Health check server (separate from main traffic)
server {
    listen 8081;
    server_name localhost;
    
    # Health checks only
    location /health/nginx {
        access_log off;
        return 200 "nginx healthy\n";
        add_header Content-Type text/plain;
    }
    
    location /health/bytebot {
        proxy_pass http://bytebot_api/health;
        access_log off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    
    location /health/browser-use {
        proxy_pass http://browser_use_api/health;
        access_log off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

# Development server (if needed)
server {
    listen 8082;
    server_name dev.localhost;
    
    # Enable detailed logging for development
    error_log /var/log/nginx/dev_error.log debug;
    access_log /var/log/nginx/dev_access.log main;
    
    # Development specific settings
    client_max_body_size 100M;
    
    location / {
        proxy_pass http://bytebot_api;
        proxy_set_header X-Development-Mode true;
        
        # CORS for development
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
        
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }
}