---
# Secret Rotation Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bytebot-secret-rotator
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: secret-rotation
    version: "2.0.0"
  annotations:
    secrets.bytebot.ai/purpose: "Automated secret rotation service"

---
# RBAC Role for Secret Management
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: bytebot-production
  name: bytebot-secret-manager
  labels:
    app: bytebot-agent
    component: secret-management
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch"]

---
# RBAC RoleBinding for Secret Management
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bytebot-secret-manager-binding
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: secret-management
subjects:
- kind: ServiceAccount
  name: bytebot-secret-rotator
  namespace: bytebot-production
roleRef:
  kind: Role
  name: bytebot-secret-manager
  apiGroup: rbac.authorization.k8s.io

---
# Secret Rotation CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bytebot-secret-rotator
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: secret-rotation
    version: "2.0.0"
  annotations:
    secrets.bytebot.ai/purpose: "Automated secret rotation every 7 days"
    secrets.bytebot.ai/rotation-schedule: "0 2 */7 * *"
spec:
  # Run every 7 days at 2 AM
  schedule: "0 2 */7 * *"
  timezone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app: bytebot-agent
        component: secret-rotation
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 3600 # 1 hour timeout
      template:
        metadata:
          labels:
            app: bytebot-agent
            component: secret-rotation
        spec:
          serviceAccountName: bytebot-secret-rotator
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            fsGroup: 65534
          containers:
          - name: secret-rotator
            image: bytebot/secret-rotator:2.0.0
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - |
              #!/bin/sh
              set -e
              
              echo "Starting secret rotation process..."
              
              # Check if rotation is needed
              LAST_ROTATION=$(kubectl get secret bytebot-agent-secrets-v2 -o jsonpath='{.metadata.annotations.secrets\.bytebot\.ai/last-rotation}' || echo "never")
              CURRENT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              
              echo "Last rotation: $LAST_ROTATION"
              echo "Current time: $CURRENT_TIME"
              
              # Generate new secrets
              echo "Generating new secure secrets..."
              
              # Generate new JWT secret (64 characters)
              NEW_JWT_SECRET=$(openssl rand -hex 32)
              NEW_JWT_SECRET_B64=$(echo -n "$NEW_JWT_SECRET" | base64 -w 0)
              
              # Generate new encryption key (64 characters)
              NEW_ENCRYPTION_KEY=$(openssl rand -hex 32)
              NEW_ENCRYPTION_KEY_B64=$(echo -n "$NEW_ENCRYPTION_KEY" | base64 -w 0)
              
              # Create updated secret manifest
              kubectl patch secret bytebot-agent-secrets-v2 -p "{
                \"data\": {
                  \"jwt-secret\": \"$NEW_JWT_SECRET_B64\",
                  \"encryption-key\": \"$NEW_ENCRYPTION_KEY_B64\"
                },
                \"metadata\": {
                  \"annotations\": {
                    \"secrets.bytebot.ai/last-rotation\": \"$CURRENT_TIME\",
                    \"secrets.bytebot.ai/rotation-version\": \"$(date +%s)\"
                  }
                }
              }"
              
              # Trigger rolling update of deployment
              echo "Triggering rolling update of Bytebot Agent deployment..."
              kubectl patch deployment bytebot-agent -p "{
                \"spec\": {
                  \"template\": {
                    \"metadata\": {
                      \"annotations\": {
                        \"secrets.bytebot.ai/restart-trigger\": \"$CURRENT_TIME\"
                      }
                    }
                  }
                }
              }"
              
              echo "Secret rotation completed successfully"
              
              # Create event for monitoring
              kubectl create event secret-rotation-completed \
                --type=Normal \
                --reason=SecretRotated \
                --message="Bytebot Agent secrets rotated successfully at $CURRENT_TIME" || true
            
            env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            
            resources:
              requests:
                memory: "64Mi"
                cpu: "100m"
              limits:
                memory: "128Mi"
                cpu: "200m"
            
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL

---
# Secret Monitor for Health Checks
apiVersion: v1
kind: ConfigMap
metadata:
  name: bytebot-secret-monitor
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: secret-monitoring
    version: "2.0.0"
data:
  monitor.sh: |
    #!/bin/bash
    set -e
    
    # Monitor secret health and rotation status
    NAMESPACE=${NAMESPACE:-bytebot-production}
    SECRET_NAME=${SECRET_NAME:-bytebot-agent-secrets-v2}
    
    echo "Monitoring secret health for $SECRET_NAME in namespace $NAMESPACE..."
    
    # Check if secret exists
    if ! kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
      echo "ERROR: Secret $SECRET_NAME not found in namespace $NAMESPACE"
      exit 1
    fi
    
    # Check secret age
    CREATED=$(kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" -o jsonpath='{.metadata.creationTimestamp}')
    LAST_ROTATION=$(kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" -o jsonpath='{.metadata.annotations.secrets\.bytebot\.ai/last-rotation}' || echo "never")
    
    echo "Secret created: $CREATED"
    echo "Last rotation: $LAST_ROTATION"
    
    # Check if rotation is overdue (> 8 days)
    if [ "$LAST_ROTATION" != "never" ]; then
      ROTATION_TIMESTAMP=$(date -d "$LAST_ROTATION" +%s 2>/dev/null || echo "0")
      CURRENT_TIMESTAMP=$(date +%s)
      DAYS_SINCE_ROTATION=$(( (CURRENT_TIMESTAMP - ROTATION_TIMESTAMP) / 86400 ))
      
      echo "Days since last rotation: $DAYS_SINCE_ROTATION"
      
      if [ "$DAYS_SINCE_ROTATION" -gt 8 ]; then
        echo "WARNING: Secret rotation is overdue by $(($DAYS_SINCE_ROTATION - 7)) days"
        exit 2
      fi
    fi
    
    # Validate required keys exist
    REQUIRED_KEYS=("jwt-secret" "encryption-key" "database-url")
    
    for key in "${REQUIRED_KEYS[@]}"; do
      if ! kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" -o jsonpath="{.data.$key}" | base64 -d >/dev/null 2>&1; then
        echo "ERROR: Required secret key '$key' is missing or invalid"
        exit 1
      fi
    done
    
    echo "Secret health check passed"
    exit 0

---
# Secret Backup Job (Manual)
apiVersion: batch/v1
kind: Job
metadata:
  name: bytebot-secret-backup
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: secret-backup
    version: "2.0.0"
  annotations:
    secrets.bytebot.ai/purpose: "Manual secret backup for disaster recovery"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800 # 30 minutes timeout
  template:
    metadata:
      labels:
        app: bytebot-agent
        component: secret-backup
    spec:
      serviceAccountName: bytebot-secret-rotator
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: secret-backup
        image: bytebot/secret-rotator:2.0.0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          #!/bin/sh
          set -e
          
          echo "Creating encrypted backup of Bytebot Agent secrets..."
          
          BACKUP_TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          BACKUP_NAME="bytebot-secrets-backup-$BACKUP_TIMESTAMP"
          
          # Export current secrets (without values for security)
          kubectl get secret bytebot-agent-secrets-v2 -o yaml | \
            sed 's/data:/# data: [REDACTED FOR SECURITY]/g' > "/tmp/$BACKUP_NAME.yaml"
          
          # Create metadata backup
          kubectl get secret bytebot-agent-secrets-v2 -o jsonpath='{.metadata}' | \
            jq . > "/tmp/$BACKUP_NAME-metadata.json"
          
          echo "Backup created: $BACKUP_NAME"
          echo "Backup files created in /tmp/ (metadata only for security)"
          echo "IMPORTANT: Actual secret data is NOT included in backup for security"
          
          # Store backup information as configmap for reference
          kubectl create configmap "$BACKUP_NAME" \
            --from-literal=timestamp="$BACKUP_TIMESTAMP" \
            --from-literal=status="completed" \
            --from-literal=type="metadata-only" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "Secret backup completed successfully"
        
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL