    secrets.bytebot.ai/rotation-policy: "manual"
    secrets.bytebot.ai/audit-enabled: "true"
    secrets.bytebot.ai/description: "Staging secrets for Bytebot Agent testing"
type: Opaque
data:
  database-url: <BASE64_ENCODED_STAGING_DATABASE_URL>
  jwt-secret: <BASE64_ENCODED_STAGING_JWT_SECRET>
  encryption-key: <BASE64_ENCODED_STAGING_ENCRYPTION_KEY>
  anthropic-api-key: <BASE64_ENCODED_ANTHROPIC_API_KEY>
  openai-api-key: <BASE64_ENCODED_OPENAI_API_KEY>
  gemini-api-key: <BASE64_ENCODED_GEMINI_API_KEY>
  redis-url: <BASE64_ENCODED_STAGING_REDIS_URL>

