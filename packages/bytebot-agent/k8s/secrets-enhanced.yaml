# Enhanced Kubernetes Secrets - Bytebot Agent Enterprise Secrets Management
# Enterprise-grade secrets management with rotation, monitoring, and multi-environment support
# Use 'kubectl apply' with proper RBAC permissions to deploy

apiVersion: v1
kind: Secret
metadata:
  name: bytebot-agent-secrets-v2
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: secrets-management
    version: "2.0.0"
    environment: production
    secrets.bytebot.ai/managed: "true"
    secrets.bytebot.ai/rotation-enabled: "true"
  annotations:
    secrets.bytebot.ai/created: "2024-12-19T00:00:00Z"
    secrets.bytebot.ai/rotation-interval: "7d"
    secrets.bytebot.ai/rotation-policy: "automatic"
    secrets.bytebot.ai/backup-enabled: "true"
    secrets.bytebot.ai/audit-enabled: "true"
    secrets.bytebot.ai/description: "Enterprise secrets for Bytebot Agent with automatic rotation"
type: Opaque
data:
  # Database Configuration (Base64 encoded)
  # Example: postgresql://bytebot_user:SECURE_PASSWORD@postgres-cluster:5432/bytebot_production?sslmode=require&connect_timeout=30
  database-url: <BASE64_ENCODED_SECURE_DATABASE_URL>
  
  # JWT Authentication (Base64 encoded, minimum 64 characters for production)
  # Generate with: openssl rand -hex 32 | base64 -w 0
  jwt-secret: <BASE64_ENCODED_JWT_SECRET_64_CHARS>
  
  # Encryption Key for secrets encryption (Base64 encoded, minimum 64 characters)
  # Generate with: openssl rand -hex 32 | base64 -w 0
  encryption-key: <BASE64_ENCODED_ENCRYPTION_KEY_64_CHARS>
  
  # LLM API Keys (Base64 encoded)
  anthropic-api-key: <BASE64_ENCODED_ANTHROPIC_API_KEY>
  openai-api-key: <BASE64_ENCODED_OPENAI_API_KEY>
  gemini-api-key: <BASE64_ENCODED_GEMINI_API_KEY>
  
  # Redis Configuration (Base64 encoded)
  redis-url: <BASE64_ENCODED_REDIS_CONNECTION_STRING>
  
  # External Services
  analytics-api-key: <BASE64_ENCODED_ANALYTICS_API_KEY>
  webhook-secret: <BASE64_ENCODED_WEBHOOK_SECRET>
  
  # TLS Certificates (Base64 encoded PEM format)
  tls-cert: <BASE64_ENCODED_TLS_CERTIFICATE>
  tls-key: <BASE64_ENCODED_TLS_PRIVATE_KEY>
  tls-ca: <BASE64_ENCODED_CA_CERTIFICATE>

---
