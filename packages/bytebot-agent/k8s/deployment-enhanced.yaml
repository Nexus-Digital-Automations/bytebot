# Enhanced Kubernetes Deployment - Bytebot Agent with Enterprise Secrets Management
# Comprehensive deployment with secrets integration, security hardening, and monitoring

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bytebot-agent-enhanced
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: agent-service
    version: "2.0.0"
    environment: production
    secrets.bytebot.ai/managed: "true"
  annotations:
    deployment.kubernetes.io/revision: "1"
    secrets.bytebot.ai/secret-version: "v2"
    secrets.bytebot.ai/rotation-enabled: "true"
    secrets.bytebot.ai/last-update: "2024-12-19T00:00:00Z"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bytebot-agent
      component: agent-service
  template:
    metadata:
      labels:
        app: bytebot-agent
        component: agent-service
        version: "2.0.0"
        secrets.bytebot.ai/managed: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        secrets.bytebot.ai/secret-checksum: "placeholder-will-be-updated"
        secrets.bytebot.ai/config-version: "v2.0.0"
    spec:
      serviceAccountName: bytebot-agent-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      
      # Init container for secret validation
      initContainers:
      - name: secret-validator
        image: bytebot/secret-validator:2.0.0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          #!/bin/sh
          set -e
          
          echo "Validating secrets before application startup..."
          
          # Validate required secrets exist and are not empty
          REQUIRED_SECRETS="jwt-secret encryption-key database-url"
          
          for secret in $REQUIRED_SECRETS; do
            if [ ! -f "/etc/secrets/$secret" ]; then
              echo "ERROR: Required secret '$secret' not found"
              exit 1
            fi
            
            if [ ! -s "/etc/secrets/$secret" ]; then
              echo "ERROR: Required secret '$secret' is empty"
              exit 1
            fi
            
            echo "✓ Secret '$secret' validated"
          done
          
          # Validate secret formats
          JWT_SECRET_LENGTH=$(cat /etc/secrets/jwt-secret | wc -c)
          if [ "$JWT_SECRET_LENGTH" -lt 32 ]; then
            echo "ERROR: JWT secret is too short (minimum 32 characters)"
            exit 1
          fi
          
          ENCRYPTION_KEY_LENGTH=$(cat /etc/secrets/encryption-key | wc -c)
          if [ "$ENCRYPTION_KEY_LENGTH" -lt 32 ]; then
            echo "ERROR: Encryption key is too short (minimum 32 characters)"
            exit 1
          fi
          
          echo "All secrets validated successfully"
          
        volumeMounts:
        - name: secrets-volume
          mountPath: /etc/secrets
          readOnly: true
        
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
      
      containers:
      - name: bytebot-agent
        image: bytebot/agent:2.0.0-enhanced
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 9991
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: health
          containerPort: 8080
          protocol: TCP
        
        # Environment variables for application configuration
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "9991"
        - name: METRICS_PORT
          value: "9090"
        - name: HEALTH_PORT
          value: "8080"
        
        # Kubernetes-specific environment variables
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        
        # Service configuration
        - name: BYTEBOT_DESKTOP_BASE_URL
          value: "http://bytebot-desktop:9990"
        - name: BYTEBOT_LLM_PROXY_URL
          value: "http://bytebot-llm-proxy:8000"
        
        # Feature flags for production
        - name: ENABLE_AUTHENTICATION
          value: "true"
        - name: ENABLE_RATE_LIMITING
          value: "true"
        - name: ENABLE_METRICS_COLLECTION
          value: "true"
        - name: ENABLE_HEALTH_CHECKS
          value: "true"
        - name: ENABLE_CIRCUIT_BREAKER
          value: "true"
        - name: ENABLE_DISTRIBUTED_TRACING
          value: "true"
        - name: ENABLE_SWAGGER
          value: "false"
        - name: DEBUG_MODE
          value: "false"
        
        # Logging configuration
        - name: LOG_LEVEL
          value: "warn"
        - name: LOG_FORMAT
          value: "json"
        
        # Security configuration
        - name: JWT_EXPIRES_IN
          value: "15m"
        - name: JWT_REFRESH_EXPIRES_IN
          value: "7d"
        
        # Database configuration
        - name: DATABASE_MAX_CONNECTIONS
          value: "20"
        - name: DATABASE_CONNECTION_TIMEOUT
          value: "30000"
        - name: DB_SSL_ENABLED
          value: "true"
        - name: DB_SSL_MODE
          value: "require"
        
        # API configuration
        - name: API_RATE_LIMIT_WINDOW
          value: "900000"
        - name: API_RATE_LIMIT_MAX_REQUESTS
          value: "100"
        - name: BODY_PARSER_LIMIT
          value: "10mb"
        - name: REQUEST_TIMEOUT
          value: "30000"
        
        # Monitoring configuration
        - name: PROMETHEUS_METRICS_PORT
          value: "9090"
        - name: JAEGER_ENDPOINT
          value: "http://jaeger-collector:14268/api/traces"
        
        # Circuit breaker configuration
        - name: CIRCUIT_BREAKER_FAILURE_THRESHOLD
          value: "5"
        - name: CIRCUIT_BREAKER_TIMEOUT
          value: "60000"
        - name: CIRCUIT_BREAKER_RESET_TIMEOUT
          value: "30000"
        
        # Health check configuration
        - name: HEALTH_CHECK_TIMEOUT
          value: "5000"
        - name: HEALTH_CHECK_INTERVAL
          value: "30000"
        
        # Performance configuration
        - name: GRACEFUL_SHUTDOWN_TIMEOUT
          value: "30000"
        
        # Enhanced secrets configuration
        - name: SECRETS_ROTATION_ENABLED
          value: "true"
        - name: SECRETS_ROTATION_INTERVAL
          value: "604800000"  # 7 days
        - name: SECRETS_MAX_AGE
          value: "604800000"  # 7 days
        - name: SECRETS_NOTIFY_BEFORE_EXPIRY
          value: "86400000"   # 1 day
        - name: SECRETS_AUTO_ROTATE_ON_EXPIRY
          value: "true"
        - name: SECRETS_BACKUP_ON_ROTATION
          value: "true"
        - name: SECRETS_VALIDATE_AFTER_ROTATION
          value: "true"
        
        # External secrets providers (disabled by default)
        - name: SECRETS_VAULT_ENABLED
          value: "false"
        - name: SECRETS_AWS_ENABLED
          value: "false"
        - name: SECRETS_AZURE_ENABLED
          value: "false"
        - name: SECRETS_GCP_ENABLED
          value: "false"
        
        # Volume mounts for secrets
        volumeMounts:
        - name: secrets-volume
          mountPath: /etc/secrets
          readOnly: true
        - name: tls-certs
          mountPath: /etc/tls
          readOnly: true
        - name: temp-volume
          mountPath: /tmp
        - name: cache-volume
          mountPath: /var/cache/bytebot
        
        # Security context
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        
        # Resource requirements
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "1Gi"
            cpu: "500m"
            ephemeral-storage: "2Gi"
        
        # Probes for health monitoring
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
          successThreshold: 1
        
        startupProbe:
          httpGet:
            path: /health/startup
            port: health
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
          successThreshold: 1
        
        # Lifecycle hooks
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                echo "Graceful shutdown initiated..."
                # Give the application time to finish processing requests
                sleep 15
                echo "Shutdown complete"
      
      # DNS configuration for better performance
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
        - name: ndots
          value: "2"
        - name: edns0
      
      # Node selection and affinity
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - bytebot-agent
              topologyKey: kubernetes.io/hostname
      
      # Tolerations for dedicated nodes (if any)
      tolerations:
      - key: "bytebot.ai/dedicated"
        operator: "Equal"
        value: "agent"
        effect: "NoSchedule"
      
      # Image pull secrets
      imagePullSecrets:
      - name: bytebot-registry
      
      # Volumes
      volumes:
      - name: secrets-volume
        secret:
          secretName: bytebot-agent-secrets-v2
          defaultMode: 0400
          items:
          - key: jwt-secret
            path: jwt-secret
          - key: encryption-key
            path: encryption-key
          - key: database-url
            path: database-url
          - key: anthropic-api-key
            path: anthropic-api-key
          - key: openai-api-key
            path: openai-api-key
          - key: gemini-api-key
            path: gemini-api-key
          - key: redis-url
            path: redis-url
          - key: analytics-api-key
            path: analytics-api-key
          - key: webhook-secret
            path: webhook-secret
      
      - name: tls-certs
        secret:
          secretName: bytebot-agent-tls
          defaultMode: 0400
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          - key: ca.crt
            path: ca.crt
      
      - name: temp-volume
        emptyDir:
          sizeLimit: 1Gi
          medium: Memory
      
      - name: cache-volume
        emptyDir:
          sizeLimit: 2Gi
      
      # Termination grace period
      terminationGracePeriodSeconds: 60

---
# Service Account for Bytebot Agent
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bytebot-agent-service
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: service-account
    version: "2.0.0"
  annotations:
    secrets.bytebot.ai/purpose: "Service account for Bytebot Agent with secrets access"

---
# RBAC Role for Bytebot Agent
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: bytebot-production
  name: bytebot-agent-role
  labels:
    app: bytebot-agent
    component: rbac
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
  resourceNames: ["bytebot-agent-secrets-v2"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]

---
# RBAC RoleBinding for Bytebot Agent
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bytebot-agent-role-binding
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: rbac
subjects:
- kind: ServiceAccount
  name: bytebot-agent-service
  namespace: bytebot-production
roleRef:
  kind: Role
  name: bytebot-agent-role
  apiGroup: rbac.authorization.k8s.io

---
# Service for Bytebot Agent
apiVersion: v1
kind: Service
metadata:
  name: bytebot-agent-service
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: service
    version: "2.0.0"
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9991
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  - name: health
    port: 8080
    targetPort: health
    protocol: TCP
  selector:
    app: bytebot-agent
    component: agent-service

---
# Horizontal Pod Autoscaler for Bytebot Agent
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bytebot-agent-hpa
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: autoscaling
    version: "2.0.0"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bytebot-agent-enhanced
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
# Pod Disruption Budget for High Availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bytebot-agent-pdb
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: disruption-budget
    version: "2.0.0"
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: bytebot-agent
      component: agent-service

---
# Network Policy for Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bytebot-agent-network-policy
  namespace: bytebot-production
  labels:
    app: bytebot-agent
    component: network-security
    version: "2.0.0"
spec:
  podSelector:
    matchLabels:
      app: bytebot-agent
      component: agent-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: bytebot-production
    - namespaceSelector:
        matchLabels:
          name: istio-system
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9991
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: bytebot-production
    ports:
    - protocol: TCP
      port: 9990  # BytebotD
    - protocol: TCP
      port: 8000  # LLM Proxy
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 53    # DNS
    - protocol: UDP
      port: 53    # DNS
  - to: []  # Allow all outbound for API calls (can be restricted further)
    ports:
    - protocol: TCP
      port: 443   # HTTPS
    - protocol: TCP
      port: 80    # HTTP