# Docker Compose for Bytebot Browser Automation Platform - Local Deployment
# 100% Local-Only Architecture with Browser-Use Integration
# 
# Services:
# - bytebot-agent: Main NestJS API server
# - browser-use: Python browser automation service 
# - postgres: PostgreSQL database with optimizations
# - redis: Caching and session storage
# - pgbouncer: Connection pooling
# - chrome: Headless Chrome for automation
# - prometheus: Metrics collection
# - grafana: Monitoring dashboards
# - nginx: Reverse proxy and load balancer
#
# Network: 100% local bridge network with service discovery
# Storage: Local volumes with persistent data

version: '3.8'

services:
  # Main Bytebot Agent Service
  bytebot-agent:
    build:
      context: ../..
      dockerfile: ./packages/bytebot-agent/Dockerfile
      args:
        NODE_ENV: production
    container_name: bytebot-agent
    restart: unless-stopped
    
    environment:
      # Core Configuration
      NODE_ENV: production
      PORT: 9991
      
      # Database Connection (via PgBouncer)
      DATABASE_URL: postgresql://bytebot_user:${POSTGRES_PASSWORD:-secure_database_password_2024}@pgbouncer:6432/bytebot_production
      
      # Redis Configuration
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      
      # Security
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-at-least-32-chars-long-change-in-prod}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-at-least-32-chars}
      
      # Browser-Use Integration
      BROWSER_USE_ENABLED: true
      BROWSER_USE_SERVICE_URL: http://browser-use:8080
      BROWSER_USE_PYTHON_PATH: python3
      BROWSER_USE_PATH: /app/browser-use
      BROWSER_USE_WORKING_DIR: /app/data/browser-use
      BROWSER_USE_HEADLESS: true
      BROWSER_USE_SCREENSHOTS: true
      BROWSER_USE_VIDEO_RECORDING: false
      BROWSER_USE_LOGGING: true
      BROWSER_USE_LOG_LEVEL: INFO
      BROWSER_USE_MAX_SESSIONS: 5
      BROWSER_USE_SESSION_TIMEOUT: 600000
      CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
      BROWSER_USE_USER_DATA_DIR: /app/data/chrome-user-data
      
      # API Configuration
      API_RATE_LIMIT_WINDOW: 900000
      API_RATE_LIMIT_MAX_REQUESTS: 100
      API_CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      API_BODY_PARSER_LIMIT: 50mb
      API_REQUEST_TIMEOUT: 30000
      
      # LLM API Keys (Optional - set via .env)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      
      # Monitoring
      PROMETHEUS_METRICS_PORT: 9464
      LOG_LEVEL: info
      LOG_FORMAT: json
      
      # Feature Flags
      FEATURES_AUTHENTICATION: true
      FEATURES_RATE_LIMITING: true
      FEATURES_METRICS_COLLECTION: true
      FEATURES_HEALTH_CHECKS: true
      FEATURES_CIRCUIT_BREAKER: true
    
    ports:
      - "9991:9991"      # Main API
      - "9464:9464"      # Prometheus metrics
    
    volumes:
      - bytebot_data:/app/data
      - bytebot_logs:/app/logs
      - chrome_user_data:/app/data/chrome-user-data
      - browser_use_data:/app/data/browser-use
      - shared_screenshots:/app/data/screenshots
      
    networks:
      - bytebot-network
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      browser-use:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9991/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Browser-Use Python Service
  browser-use:
    build:
      context: ./docker/browser-use
      dockerfile: Dockerfile
    container_name: browser-use-service
    restart: unless-stopped
    
    environment:
      # Service Configuration
      PORT: 8080
      LOG_LEVEL: INFO
      
      # Browser Configuration
      CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
      HEADLESS: true
      SCREENSHOTS_ENABLED: true
      VIDEO_RECORDING_ENABLED: false
      USER_DATA_DIR: /app/data/chrome-user-data
      WORKING_DIR: /app/data/browser-use
      
      # Session Management
      MAX_CONCURRENT_SESSIONS: 10
      SESSION_TIMEOUT: 600000
      CLEANUP_INTERVAL: 300000
      
      # Security
      ALLOWED_ORIGINS: http://bytebot-agent:9991
      API_KEY: ${BROWSER_USE_API_KEY:-secure-api-key-change-in-prod}
      
      # Resource Limits
      MAX_MEMORY_PER_SESSION: 512MB
      MAX_CPU_PER_SESSION: 0.5
    
    ports:
      - "8080:8080"      # Browser-Use API
      - "8081:8081"      # Health/status endpoint
    
    volumes:
      - browser_use_data:/app/data/browser-use
      - chrome_user_data:/app/data/chrome-user-data
      - shared_screenshots:/app/data/screenshots
      - /dev/shm:/dev/shm      # Shared memory for Chrome
    
    networks:
      - bytebot-network
    
    # Chrome requires specific capabilities for containerized automation
    security_opt:
      - seccomp:unconfined
    
    cap_add:
      - SYS_ADMIN
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bytebot-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: bytebot_production
      POSTGRES_USER: bytebot_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_database_password_2024}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c log_destination=stderr
      -c logging_collector=on
      -c log_directory=/var/log/postgresql
      -c log_statement=ddl
      -c log_min_duration_statement=1000
      -c shared_preload_libraries=pg_stat_statements
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bytebot_user -d bytebot_production -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    
    networks:
      - bytebot-network

  # Redis for Caching and Session Storage
  redis:
    image: redis:7-alpine
    container_name: bytebot-redis
    restart: unless-stopped
    
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1 300 10 60 10000
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    
    ports:
      - "6379:6379"
    
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    
    networks:
      - bytebot-network

  # PgBouncer Connection Pooling
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: bytebot-pgbouncer
    restart: unless-stopped
    
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: bytebot_user
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-secure_database_password_2024}
      DATABASES_DBNAME: bytebot_production
      POOL_MODE: transaction
      SERVER_RESET_QUERY: DISCARD ALL
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 5
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 600
      LOG_CONNECTIONS: 1
      LOG_DISCONNECTIONS: 1
      STATS_PERIOD: 60
    
    ports:
      - "6432:6432"
    
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    
    depends_on:
      postgres:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD-SHELL", "psql -h localhost -p 6432 -U bytebot_user -d pgbouncer -c 'SHOW STATS;' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - bytebot-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bytebot-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    
    depends_on:
      - bytebot-agent
      - browser-use
    
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    
    networks:
      - bytebot-network

  # Prometheus Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: bytebot-prometheus
    restart: unless-stopped
    
    ports:
      - "9090:9090"
    
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    
    networks:
      - bytebot-network

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: bytebot-postgres-exporter
    restart: unless-stopped
    
    environment:
      DATA_SOURCE_NAME: "postgresql://bytebot_user:${POSTGRES_PASSWORD:-secure_database_password_2024}@postgres:5432/bytebot_production?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"
    
    volumes:
      - ./docker/postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    
    ports:
      - "9187:9187"
    
    depends_on:
      postgres:
        condition: service_healthy
    
    networks:
      - bytebot-network

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: bytebot-redis-exporter
    restart: unless-stopped
    
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    
    ports:
      - "9121:9121"
    
    depends_on:
      redis:
        condition: service_healthy
    
    networks:
      - bytebot-network

  # Grafana Monitoring Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: bytebot-grafana
    restart: unless-stopped
    
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-secure_grafana_password}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/bytebot-overview.json
    
    ports:
      - "3001:3000"
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    depends_on:
      - prometheus
    
    networks:
      - bytebot-network

  # Log Aggregation (Optional)
  loki:
    image: grafana/loki:latest
    container_name: bytebot-loki
    restart: unless-stopped
    
    ports:
      - "3100:3100"
    
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    
    command: -config.file=/etc/loki/local-config.yaml
    
    networks:
      - bytebot-network

# Named Volumes for Data Persistence
volumes:
  # Database storage
  postgres_data:
    driver: local
  redis_data:
    driver: local
  
  # Application data
  bytebot_data:
    driver: local
  bytebot_logs:
    driver: local
  
  # Browser automation storage
  chrome_user_data:
    driver: local
  browser_use_data:
    driver: local
  shared_screenshots:
    driver: local
  
  # Monitoring storage
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  
  # Infrastructure logs
  nginx_logs:
    driver: local

# Custom Network for Service Communication
networks:
  bytebot-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.enable_ipv6: "false"
      com.docker.network.bridge.name: bytebot-bridge