version: '3.8'

services:
  mdm-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mdm-platform
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - MDM_PORT=3003
      - MDM_DATABASE_PATH=/app/data/mdm.sqlite
      - MDM_JWT_SECRET=${MDM_JWT_SECRET:-mdm-super-secret-key-change-in-production}
      - MDM_PARLANT_ENABLED=true
      - MDM_PARLANT_ENDPOINT=http://parlant:8000
      - MDM_LOG_LEVEL=info
      - MDM_ENABLE_METRICS=true
    volumes:
      - mdm_data:/app/data
      - mdm_logs:/app/logs
      - mdm_uploads:/app/uploads
    networks:
      - mdm_network
    depends_on:
      - parlant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  parlant:
    image: parlant/server:latest
    container_name: mdm-parlant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PARLANT_PORT=8000
      - PARLANT_LOG_LEVEL=info
      - PARLANT_API_KEY=${MDM_PARLANT_API_KEY:-parlant-api-key}
    networks:
      - mdm_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mdm-console:
    build:
      context: ../mdm-console
      dockerfile: Dockerfile
    container_name: mdm-console
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      - REACT_APP_MDM_API_URL=http://mdm-platform:3003/api/v1
      - REACT_APP_ENV=production
    networks:
      - mdm_network
    depends_on:
      - mdm-platform

  nginx:
    image: nginx:alpine
    container_name: mdm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - mdm_logs:/var/log/nginx
    networks:
      - mdm_network
    depends_on:
      - mdm-platform
      - mdm-console

  prometheus:
    image: prom/prometheus:latest
    container_name: mdm-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - mdm_network

  grafana:
    image: grafana/grafana:latest
    container_name: mdm-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - mdm_network
    depends_on:
      - prometheus

networks:
  mdm_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mdm_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
  mdm_logs:
    driver: local
  mdm_uploads:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local