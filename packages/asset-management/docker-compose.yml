version: '3.8'\n\nservices:\n  # Digital Asset Management Core Service\n  asset-management:\n    build:\n      context: .\n      dockerfile: Dockerfile\n    container_name: bytebot-asset-management\n    ports:\n      - \"3003:3003\"\n    environment:\n      - NODE_ENV=production\n      - DATABASE_TYPE=postgres\n      - DB_HOST=postgres\n      - DB_PORT=5432\n      - DB_NAME=asset_management\n      - DB_USERNAME=postgres\n      - DB_PASSWORD=postgres\n      - JWT_SECRET=your-super-secret-jwt-key-change-in-production\n      - STORAGE_PATH=/app/data/assets\n      - SEARCH_INDEX_PATH=/app/data/search-index\n    volumes:\n      - ./data/assets:/app/data/assets\n      - ./data/search-index:/app/data/search-index\n      - ./data/logs:/app/logs\n    depends_on:\n      - postgres\n      - redis\n    networks:\n      - asset-management-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3003/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 40s\n\n  # Asset Management Web UI\n  asset-management-ui:\n    build:\n      context: ../asset-management-ui\n      dockerfile: Dockerfile\n    container_name: bytebot-asset-management-ui\n    ports:\n      - \"3004:3004\"\n    environment:\n      - NODE_ENV=production\n      - ASSET_MANAGEMENT_API_URL=http://asset-management:3003\n      - WEBSOCKET_URL=ws://asset-management:3003\n    depends_on:\n      - asset-management\n    networks:\n      - asset-management-network\n    restart: unless-stopped\n\n  # PostgreSQL Database (Local)\n  postgres:\n    image: postgres:15-alpine\n    container_name: bytebot-postgres\n    ports:\n      - \"5432:5432\"\n    environment:\n      - POSTGRES_DB=asset_management\n      - POSTGRES_USER=postgres\n      - POSTGRES_PASSWORD=postgres\n      - PGDATA=/var/lib/postgresql/data/pgdata\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n      - ./database/init:/docker-entrypoint-initdb.d\n    networks:\n      - asset-management-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  # Redis for Caching and Session Storage\n  redis:\n    image: redis:7-alpine\n    container_name: bytebot-redis\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis_data:/data\n      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf\n    command: redis-server /usr/local/etc/redis/redis.conf\n    networks:\n      - asset-management-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 3s\n      retries: 3\n\n  # Nginx Reverse Proxy (Local)\n  nginx:\n    image: nginx:alpine\n    container_name: bytebot-nginx\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    volumes:\n      - ./nginx/nginx.conf:/etc/nginx/nginx.conf\n      - ./nginx/conf.d:/etc/nginx/conf.d\n      - ./ssl:/etc/nginx/ssl\n      - ./data/assets:/var/www/assets:ro\n    depends_on:\n      - asset-management\n      - asset-management-ui\n    networks:\n      - asset-management-network\n    restart: unless-stopped\n\n  # Prometheus for Monitoring (Local)\n  prometheus:\n    image: prom/prometheus:latest\n    container_name: bytebot-prometheus\n    ports:\n      - \"9090:9090\"\n    volumes:\n      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml\n      - prometheus_data:/prometheus\n    command:\n      - '--config.file=/etc/prometheus/prometheus.yml'\n      - '--storage.tsdb.path=/prometheus'\n      - '--web.console.libraries=/etc/prometheus/console_libraries'\n      - '--web.console.templates=/etc/prometheus/consoles'\n      - '--storage.tsdb.retention.time=30d'\n      - '--web.enable-lifecycle'\n    networks:\n      - asset-management-network\n    restart: unless-stopped\n\n  # Grafana for Dashboards (Local)\n  grafana:\n    image: grafana/grafana:latest\n    container_name: bytebot-grafana\n    ports:\n      - \"3000:3000\"\n    environment:\n      - GF_SECURITY_ADMIN_PASSWORD=admin\n      - GF_USERS_ALLOW_SIGN_UP=false\n    volumes:\n      - grafana_data:/var/lib/grafana\n      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards\n      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources\n    depends_on:\n      - prometheus\n    networks:\n      - asset-management-network\n    restart: unless-stopped\n\nvolumes:\n  postgres_data:\n    driver: local\n  redis_data:\n    driver: local\n  prometheus_data:\n    driver: local\n  grafana_data:\n    driver: local\n\nnetworks:\n  asset-management-network:\n    driver: bridge\n    ipam:\n      config:\n        - subnet: 172.20.0.0/16"