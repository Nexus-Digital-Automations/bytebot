name: Job Management Testing Framework

on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
    paths:
      - 'bytebot/packages/bytebotd/src/computer-use/**'
      - 'bytebot/packages/bytebotd/test/**'
      - 'bytebot/packages/bytebotd/jest.config.job-management.js'
      - '.github/workflows/job-management-tests.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'bytebot/packages/bytebotd/src/computer-use/**'
      - 'bytebot/packages/bytebotd/test/**'
      - 'bytebot/packages/bytebotd/jest.config.job-management.js'
  schedule:
    # Run daily at 2 AM UTC for comprehensive testing
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - performance
          - chaos
          - security
      environment:
        description: 'Environment to test against'
        required: true
        default: 'ci'
        type: choice
        options:
          - ci
          - staging
          - production

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'
  REDIS_VERSION: '7'

jobs:
  # Setup and validation
  setup:
    name: Setup and Validation
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.matrix.outputs.matrix }}
      should-run-performance: ${{ steps.conditions.outputs.performance }}
      should-run-chaos: ${{ steps.conditions.outputs.chaos }}
      should-run-security: ${{ steps.conditions.outputs.security }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          cd bytebot/packages/bytebotd
          pnpm install --frozen-lockfile

      - name: Validate test configuration
        run: |
          cd bytebot/packages/bytebotd
          node -e "console.log('Test config validation:', require('./jest.config.job-management.js'))"

      - name: Setup test matrix
        id: matrix
        run: |
          if [[ "${{ github.event.inputs.test_type }}" == "all" || "${{ github.event.inputs.test_type }}" == "" ]]; then
            echo "matrix=[\"unit\",\"integration\",\"performance\",\"chaos\",\"security\"]" >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"${{ github.event.inputs.test_type }}\"]" >> $GITHUB_OUTPUT
          fi

      - name: Determine test conditions
        id: conditions
        run: |
          # Performance tests on main branch or manual trigger
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" ]]; then
            echo "performance=true" >> $GITHUB_OUTPUT
          else
            echo "performance=false" >> $GITHUB_OUTPUT
          fi

          # Chaos tests on main branch or manual trigger
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "schedule" ]]; then
            echo "chaos=true" >> $GITHUB_OUTPUT
          else
            echo "chaos=false" >> $GITHUB_OUTPUT
          fi

          # Security tests always run
          echo "security=true" >> $GITHUB_OUTPUT

  # Unit Tests - Fast execution
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    if: contains(fromJson(needs.setup.outputs.test-matrix), 'unit')
    strategy:
      matrix:
        node-version: ['18', '20']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          cd bytebot/packages/bytebotd
          pnpm install --frozen-lockfile

      - name: Run unit tests
        run: |
          cd bytebot/packages/bytebotd
          TEST_TYPE=unit pnpm test:job-management
        env:
          CI: true
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./bytebot/packages/bytebotd/coverage/unit/lcov.info
          flags: unit-tests
          name: unit-coverage-node-${{ matrix.node-version }}

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results-node-${{ matrix.node-version }}
          path: |
            bytebot/packages/bytebotd/coverage/unit/
            bytebot/packages/bytebotd/test-results-unit.xml

  # Integration Tests - Real dependencies
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: setup
    if: contains(fromJson(needs.setup.outputs.test-matrix), 'integration')
    services:
      redis:
        image: redis:${{ env.REDIS_VERSION }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          cd bytebot/packages/bytebotd
          pnpm install --frozen-lockfile

      - name: Wait for Redis
        run: |
          timeout 30 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'

      - name: Run integration tests
        run: |
          cd bytebot/packages/bytebotd
          TEST_TYPE=integration pnpm test:job-management
        env:
          CI: true
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_TEST_DB: 15

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: |
            bytebot/packages/bytebotd/test-results-integration.xml
            bytebot/packages/bytebotd/integration-logs/

  # Performance Tests - Resource intensive
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: setup
    if: contains(fromJson(needs.setup.outputs.test-matrix), 'performance') && needs.setup.outputs.should-run-performance == 'true'
    services:
      redis:
        image: redis:${{ env.REDIS_VERSION }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          cd bytebot/packages/bytebotd
          pnpm install --frozen-lockfile

      - name: Optimize system for performance testing
        run: |
          echo 'vm.swappiness=1' | sudo tee -a /etc/sysctl.conf
          echo 'net.core.somaxconn=65535' | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Run performance tests
        run: |
          cd bytebot/packages/bytebotd
          TEST_TYPE=performance pnpm test:job-management
        env:
          CI: true
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PERF_DB: 14

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-test-results
          path: |
            bytebot/packages/bytebotd/performance-results.json
            bytebot/packages/bytebotd/performance-reports/

      - name: Comment performance results
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('bytebot/packages/bytebotd/performance-results.json', 'utf8'));
              const comment = `## Performance Test Results 🚀

              | Metric | Value | Threshold | Status |
              |--------|-------|-----------|--------|
              | Job Submission Rate | ${results.submissionRate || 'N/A'} jobs/sec | >1000 | ${(results.submissionRate || 0) > 1000 ? '✅' : '❌'} |
              | Execution Latency (p95) | ${results.latencyP95 || 'N/A'}ms | <1000ms | ${(results.latencyP95 || 0) < 1000 ? '✅' : '❌'} |
              | Memory Usage | ${results.memoryUsage || 'N/A'}MB | <500MB | ${(results.memoryUsage || 0) < 500 ? '✅' : '❌'} |

              [View detailed results](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not read performance results:', error.message);
            }

  # Chaos Tests - Failure injection
  chaos-tests:
    name: Chaos Engineering Tests
    runs-on: ubuntu-latest
    needs: setup
    if: contains(fromJson(needs.setup.outputs.test-matrix), 'chaos') && needs.setup.outputs.should-run-chaos == 'true'
    services:
      redis:
        image: redis:${{ env.REDIS_VERSION }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          cd bytebot/packages/bytebotd
          pnpm install --frozen-lockfile

      - name: Install chaos engineering tools
        run: |
          # Install network simulation tools
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables

      - name: Run chaos tests
        run: |
          cd bytebot/packages/bytebotd
          TEST_TYPE=chaos pnpm test:job-management
        env:
          CI: true
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_CHAOS_DB: 13

      - name: Upload chaos test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: chaos-test-results
          path: |
            bytebot/packages/bytebotd/chaos-results.json
            bytebot/packages/bytebotd/chaos-logs/

  # Security Tests - Vulnerability scanning
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: setup
    if: contains(fromJson(needs.setup.outputs.test-matrix), 'security')
    services:
      redis:
        image: redis:${{ env.REDIS_VERSION }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: |
          cd bytebot/packages/bytebotd
          pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          cd bytebot/packages/bytebotd
          pnpm audit --audit-level high

      - name: Run security tests
        run: |
          cd bytebot/packages/bytebotd
          TEST_TYPE=security pnpm test:job-management
        env:
          CI: true
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_SECURITY_DB: 12

      - name: Upload security test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-test-results
          path: |
            bytebot/packages/bytebotd/security-results.json
            bytebot/packages/bytebotd/security-logs/

      - name: Security scan with CodeQL
        uses: github/codeql-action/analyze@v2
        with:
          languages: typescript
          queries: security-and-quality

  # Test Summary and Reporting
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [setup, unit-tests, integration-tests, performance-tests, chaos-tests, security-tests]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v3

      - name: Generate test summary
        run: |
          echo "# Job Management Testing Framework Results" > test-summary.md
          echo "" >> test-summary.md

          echo "## Test Execution Summary" >> test-summary.md
          echo "| Test Type | Status | Node Version |" >> test-summary.md
          echo "|-----------|--------|--------------|" >> test-summary.md

          # Unit tests
          if [[ "${{ needs.unit-tests.result }}" == "success" ]]; then
            echo "| Unit Tests | ✅ Success | 18, 20 |" >> test-summary.md
          else
            echo "| Unit Tests | ❌ Failed | 18, 20 |" >> test-summary.md
          fi

          # Integration tests
          if [[ "${{ needs.integration-tests.result }}" == "success" ]]; then
            echo "| Integration Tests | ✅ Success | 18 |" >> test-summary.md
          elif [[ "${{ needs.integration-tests.result }}" == "skipped" ]]; then
            echo "| Integration Tests | ⏭️ Skipped | - |" >> test-summary.md
          else
            echo "| Integration Tests | ❌ Failed | 18 |" >> test-summary.md
          fi

          # Performance tests
          if [[ "${{ needs.performance-tests.result }}" == "success" ]]; then
            echo "| Performance Tests | ✅ Success | 18 |" >> test-summary.md
          elif [[ "${{ needs.performance-tests.result }}" == "skipped" ]]; then
            echo "| Performance Tests | ⏭️ Skipped | - |" >> test-summary.md
          else
            echo "| Performance Tests | ❌ Failed | 18 |" >> test-summary.md
          fi

          # Chaos tests
          if [[ "${{ needs.chaos-tests.result }}" == "success" ]]; then
            echo "| Chaos Tests | ✅ Success | 18 |" >> test-summary.md
          elif [[ "${{ needs.chaos-tests.result }}" == "skipped" ]]; then
            echo "| Chaos Tests | ⏭️ Skipped | - |" >> test-summary.md
          else
            echo "| Chaos Tests | ❌ Failed | 18 |" >> test-summary.md
          fi

          # Security tests
          if [[ "${{ needs.security-tests.result }}" == "success" ]]; then
            echo "| Security Tests | ✅ Success | 18 |" >> test-summary.md
          elif [[ "${{ needs.security-tests.result }}" == "skipped" ]]; then
            echo "| Security Tests | ⏭️ Skipped | - |" >> test-summary.md
          else
            echo "| Security Tests | ❌ Failed | 18 |" >> test-summary.md
          fi

          echo "" >> test-summary.md
          echo "## Additional Information" >> test-summary.md
          echo "- Workflow run: [\#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> test-summary.md
          echo "- Commit: [\`${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> test-summary.md
          echo "- Branch: ${{ github.ref_name }}" >> test-summary.md
          echo "- Triggered by: ${{ github.event_name }}" >> test-summary.md

      - name: Upload test summary
        uses: actions/upload-artifact@v3
        with:
          name: test-summary
          path: test-summary.md

      - name: Comment test summary on PR
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail workflow if critical tests failed
        if: needs.unit-tests.result == 'failure' || needs.security-tests.result == 'failure'
        run: |
          echo "Critical tests failed - failing workflow"
          exit 1