# Bytebot Platform - 100% Local-Only Deployment Architecture
# Enterprise-grade local deployment with encrypted secrets management
# No Kubernetes or cloud dependencies - Docker Compose only

name: bytebot

services:
  bytebot-desktop:
    # Build from source
    build:
      context: ../packages/
      dockerfile: bytebotd/Dockerfile
    # Use pre-built image
    image: ghcr.io/bytebot-ai/bytebot-desktop:edge
    shm_size: "2g"
    container_name: bytebot-desktop
    restart: unless-stopped
    hostname: computer
    privileged: true
    ports:
      - "9990:9990" # bytebotd service & noVNC
    environment:
      - DISPLAY=:0
    networks:
      - bytebot-network

  postgres:
    image: postgres:16-alpine
    container_name: bytebot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=bytebotdb
    networks:
      - bytebot-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bytebot-agent:
    build:
      context: ../packages/
      dockerfile: bytebot-agent/Dockerfile
    # Use pre-built image
    image: ghcr.io/bytebot-ai/bytebot-agent:edge
    container_name: bytebot-agent
    restart: unless-stopped
    ports:
      - "9991:9991"
    environment:
      # Core Configuration for Local Deployment
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/bytebotdb}
      - BYTEBOT_DESKTOP_BASE_URL=${BYTEBOT_DESKTOP_BASE_URL:-http://bytebot-desktop:9990}
      
      # Local Deployment Configuration
      - LOCAL_DEPLOYMENT_TYPE=docker-compose
      - LOCAL_DATA_DIRECTORY=/app/data
      - LOCAL_SECRETS_DIR=/app/.env/secrets
      - LOCAL_SECRETS_ENCRYPTION_KEY=${LOCAL_SECRETS_ENCRYPTION_KEY}
      
      # AI API Keys (will be stored in local encrypted storage)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      
      # Security Configuration
      - JWT_SECRET=${JWT_SECRET:-change-this-jwt-secret-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-this-encryption-key-in-production}
      
      # Feature Flags for Local Deployment
      - ENABLE_AUTHENTICATION=true
      - ENABLE_RATE_LIMITING=true
      - ENABLE_METRICS_COLLECTION=true
      - ENABLE_HEALTH_CHECKS=true
      - ENABLE_CIRCUIT_BREAKER=true
    volumes:
      # Local data persistence
      - bytebot_data:/app/data
      # Local secrets storage with proper permissions
      - bytebot_secrets:/app/.env/secrets:rw
      # Local configuration hot-reload
      - ../packages/bytebot-agent/config:/app/config:ro
    depends_on:
      - postgres
    networks:
      - bytebot-network

  bytebot-ui:
    build:
      context: ../packages/
      dockerfile: bytebot-ui/Dockerfile
      args:
        - BYTEBOT_AGENT_BASE_URL=${BYTEBOT_AGENT_BASE_URL:-http://bytebot-agent:9991}
        - BYTEBOT_DESKTOP_VNC_URL=${BYTEBOT_DESKTOP_VNC_URL:-http://bytebot-desktop:9990/websockify}
    # Use pre-built image
    image: ghcr.io/bytebot-ai/bytebot-ui:edge
    container_name: bytebot-ui
    restart: unless-stopped
    ports:
      - "9992:9992"
    environment:
      - NODE_ENV=production
      - BYTEBOT_AGENT_BASE_URL=${BYTEBOT_AGENT_BASE_URL:-http://bytebot-agent:9991}
      - BYTEBOT_DESKTOP_VNC_URL=${BYTEBOT_DESKTOP_VNC_URL:-http://bytebot-desktop:9990/websockify}
    depends_on:
      - bytebot-agent
    networks:
      - bytebot-network

networks:
  bytebot-network:
    driver: bridge

volumes:
  # Local data persistence volumes
  postgres_data:
    driver: local
  bytebot_data:
    driver: local
  bytebot_secrets:
    driver: local
    driver_opts:
      type: none
      device: ./secrets
      o: bind
