          # Create evidence package
          mkdir -p security-artifacts/compliance/${{ matrix.framework }}/evidence

          # Copy relevant security scan results
          if [[ -d "security-artifacts/downloaded" ]]; then
            cp -r security-artifacts/downloaded/* security-artifacts/compliance/${{ matrix.framework }}/evidence/ 2>/dev/null || true
          fi

          # Generate compliance summary
          cat > security-artifacts/compliance/${{ matrix.framework }}/compliance-summary.json <<EOF
